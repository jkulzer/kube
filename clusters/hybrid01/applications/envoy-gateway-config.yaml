apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
  destination:
    namespace: envoy-gateway-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: clusters/hybrid01/config/envoy-gateway-config
    repoURL: https://github.com/jkulzer/kube
    targetRevision: HEAD
