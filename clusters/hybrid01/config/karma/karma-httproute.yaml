apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karma-internal
  namespace: karma
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - karma.jkulzer.dev
  rules:
    - backendRefs:
        - name: karma
          port: 3000
