apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoygateway-internal
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoygateway-internal
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-jkulzer-dev
      port: 443
      protocol: HTTPS
      hostname: jkulzer.dev
      tls:
        mode: Terminate
        certificateRefs:
          - name: jkulzer-dev-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-jkulzer-dev-wildcard
      port: 443
      protocol: HTTPS
      hostname: "*.jkulzer.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: jkulzer-dev-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-justmeowing-net
      port: 443
      protocol: HTTPS
      hostname: justmeowing.net
      tls:
        mode: Terminate
        certificateRefs:
          - name: justmeowing-net-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-justmeowing-net-wildcard
      port: 443
      protocol: HTTPS
      hostname: "*.justmeowing.net"
      tls:
        mode: Terminate
        certificateRefs:
          - name: justmeowing-net-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: jkulzer-dev-tls
  namespace: envoy-gateway-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "cert-manager/jkulzer-dev-tls"
# i can't set the type to tls without specifying these fields, but reflector should just override them
data:
  tls.key: "meow"
  tls.crt: "meow"
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: justmeowing-net-tls
  namespace: envoy-gateway-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: "cert-manager/justmeowing-net-tls"
# i can't set the type to tls without specifying these fields, but reflector should just override them
data:
  tls.key: "meow"
  tls.crt: "meow"
