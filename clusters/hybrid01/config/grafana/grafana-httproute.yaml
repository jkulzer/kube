apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-internal
  namespace: grafana
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - grafana.jkulzer.dev
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
