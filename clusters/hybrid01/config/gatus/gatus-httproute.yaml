---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gatus
  namespace: gatus
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - status.jkulzer.dev
  rules:
    - backendRefs:
        - name: gatus
          port: 80
