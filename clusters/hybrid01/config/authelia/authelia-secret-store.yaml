---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: authelia
  namespace: authelia
  annotations:
    ## Add this annotation to disable controller warning events for unmaintained stores
    external-secrets.io/ignore-maintenance-checks: "false"
spec:
  retrySettings:
    maxRetries: 50
    retryInterval: "10s"
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "kvv2"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "authelia"
          serviceAccountRef:
            name: "default"
