apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia-internal-jkulzer-dev
  namespace: authelia
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - auth.jkulzer.dev
  rules:
    - backendRefs:
        - name: authelia
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia-internal-justmeowing-net
  namespace: authelia
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-justmeowing-net-wildcard
  hostnames:
    - auth.justmeowing.net
  rules:
    - backendRefs:
        - name: authelia
          port: 80
