apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia-external
  namespace: authelia
spec:
  parentRefs:
    - name: envoygateway-test
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - auth.jkulzer.dev
  rules:
    - backendRefs:
        - name: authelia
          port: 80
