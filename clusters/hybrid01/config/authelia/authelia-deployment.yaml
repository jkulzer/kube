---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  labels: 
    app.kubernetes.io/name: authelia
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: authelia
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9959
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  labels: 
    app.kubernetes.io/name: authelia
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels: 
      app.kubernetes.io/name: authelia
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels: 
        app.kubernetes.io/name: authelia
    spec:
      hostNetwork: false
      hostPID: false
      hostUsers: false
      hostIPC: false
      affinity: 
        nodeAffinity: {}
        podAffinity: {}
        podAntiAffinity: {}
      enableServiceLinks: false
      containers:
      - name: authelia
        image: ghcr.io/authelia/authelia:4.39.20
        imagePullPolicy: IfNotPresent
        securityContext: 
          runAsNonRoot: true
          runAsUser: 8000
          runAsGroup: 9000
          fsGroup: 8000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        command: ["authelia"]
        args:
        # - "config"
        # - "template"
        - --config=/configuration.yaml
        resources: 
          requests:
            cpu: 15m
            memory: 50Mi
          limits:
            memory: 100M
        env:
          # This enables the injection of env variables in the config
          # https://github.com/authelia/authelia/blob/master/docs/content/en/configuration/methods/files.md
        - name: X_AUTHELIA_CONFIG_FILTERS
          value: "template"
        - name: AUTHELIA_SERVER_DISABLE_HEALTHCHECK
          value: "true"
        - name: AUTHELIA_STORAGE_POSTGRES_ADDRESS
          value: tcp://authelia-pg-rw.authelia.svc.cluster.local:5432
        - name: AUTHELIA_STORAGE_POSTGRES_DATABASE
          valueFrom:
            secretKeyRef:
              name: authelia-pg-app
              key: dbname
        - name: AUTHELIA_STORAGE_POSTGRES_USERNAME
          valueFrom:
            secretKeyRef:
              name: authelia-pg-app
              key: username
        - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authelia-pg-app
              key: password
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_USERNAME
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: smtp-credentials
              key: SMTP_PASSWORD
        - name: TZ
          value: Europe/Berlin
        startupProbe:
          failureThreshold: 6
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        ports:
        - name: http
          containerPort: 9091
          protocol: TCP
        - name: metrics
          containerPort: 9959
          protocol: TCP
        volumeMounts:
        - mountPath: /configuration.yaml
          name: config
          readOnly: true
          subPath: configuration.yaml
        - mountPath: /secrets/authelia-oidc-issuer
          name: authelia-oidc-issuer
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: authelia
          items:
          - key: configuration
            path: configuration.yaml
      - name: authelia-oidc-issuer
        secret:
            secretName: authelia-oidc-issuer
            items:
              - key: tls.key
                path: tls.key
              - key: tls.crt
                path: tls.crt
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: authelia
  labels: 
    app.kubernetes.io/name: authelia
spec:
  endpoints:
    - path: /metrics
      port: metrics
  namespaceSelector:
    matchNames:
      - authelia
  selector:
    matchLabels: 
      app.kubernetes.io/name: authelia
