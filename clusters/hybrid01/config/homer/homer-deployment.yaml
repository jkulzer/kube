---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
  namespace: homer
  labels:
    app: homer
  annotations:
    configmap.reloader.stakater.com/reload: "homer-config"
spec:
  replicas: 1
  automountServiceAccountToken: false
  securityContext: 
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  selector:
    matchLabels:
      app: homer
  template:
    metadata:
      labels:
        app: homer
    spec:
      hostUsers: false
      containers:
      - image: b4bz/homer:v26.4.2
        name: homer
        securityContext: 
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: homer-data
            mountPath: /www/assets
        ports:
          - containerPort: 8080
      volumes:
        - name: homer-data
          configMap:
            name: homer-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: homer
  name: homer
  namespace: homer
spec:
  ports:
  - name: homer-service
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: homer
  type: ClusterIP
