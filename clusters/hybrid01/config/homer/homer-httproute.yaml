apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homer
  namespace: homer
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - home.jkulzer.dev
  rules:
    - backendRefs:
        - name: homer
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-auth
  namespace: homer
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homer
  extAuth:
    http:
      backendRefs:
        - name: authelia
          namespace: authelia
          port: 80
      path: /api/authz/ext-authz/
      headersToBackend:
        - authorization
        - proxy-authorization
        - remote-user
        - remote-groups
        - remote-name
        - remote-email
    headersToExtAuth:
      - accept
      - cookie
      - proxy-authorization
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
