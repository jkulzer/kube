---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-restic
  namespace: immich
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: immich
    kind: SecretStore
  target:
    name: immich-restic
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: immich
        property: restic-password
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: immich
        property: restic-repository
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: immich
        property: restic-access-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: immich
        property: restic-access-secret
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: immich-media
  namespace: immich
spec:
  sourcePVC: immich-media
  trigger:
    schedule: "30 3 * * *" # at 4:30
  rclone:
    rcloneConfigSection: "s3-bucket"
    rcloneDestPath: "prod-backup/immich/immich-media"
    rcloneConfig: "volsync-secret"
    copyMethod: Snapshot
    volumeSnapshotClassName: csi-cephfsplugin-snapshotclass
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-pg-backup
  namespace: immich
spec:
  schedule: "* 30 3 * * *" # at 4:30
  backupOwnerReference: self
  cluster:
    name: immich-pg
