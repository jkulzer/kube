---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-restic
  namespace: immich
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: immich
    kind: SecretStore
  target:
    name: immich-restic
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: immich
        property: restic-password
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: immich
        property: restic-repository
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: immich
        property: restic-access-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: immich
        property: restic-access-secret
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: immich-media-restic
  namespace: immich
spec:
  sourcePVC: immich-media
  trigger:
    schedule: "47 * * * *"
  restic:
    # moverSecurityContext:
    #   fsGroup: 991
    # Prune the repository (repack to free space) every 2 weeks
    pruneIntervalDays: 7
    # Name of the Secret with the connection information
    repository: immich-restic
    # Retention policy for backups
    retain:
      hourly: 6
      daily: 5
      weekly: 0
      monthly: 0
      yearly: 0
    copyMethod: Snapshot
    accessModes:
      - ReadOnlyMany
    cacheCapacity: 2Gi
    cacheAccessModes:
      - ReadWriteOnce
    volumeSnapshotClassName: csi-cephfsplugin-snapshotclass
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-pg-backup
  namespace: immich
spec:
  schedule: "* 30 3 * * *" # at 4:30
  backupOwnerReference: self
  cluster:
    name: immich-pg
