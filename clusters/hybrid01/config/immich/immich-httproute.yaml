apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - images.jkulzer.dev
  rules:
    - backendRefs:
        - name: immich-server
          port: 2883
