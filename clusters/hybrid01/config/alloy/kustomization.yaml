---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: alloy
    releaseName: alloy
    namespace: alloy
    repo: https://grafana.github.io/helm-charts/
    version: 1.14.2
    valuesFile: values.yaml

resources:
  - alloy-ns.yaml
  - alloy-secretstore.yaml
  - alloy-externalsecret.yaml
