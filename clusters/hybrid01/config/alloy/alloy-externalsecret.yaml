---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-maxmind
  namespace: alloy
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: alloy
    kind: SecretStore
  target:
    name: alloy-maxmind
    creationPolicy: Owner
  data:
    - secretKey: GEOIPUPDATE_ACCOUNT_ID
      remoteRef:
        key: alloy
        property: geoipupdate-account-id
    - secretKey: GEOIPUPDATE_LICENSE_KEY
      remoteRef:
        key: alloy
        property: geoipupdate-license-key
