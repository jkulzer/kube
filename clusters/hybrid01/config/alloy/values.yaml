crds:
  create: true

alloy:
  clustering:
    enabled: false
  enableReporting: false

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  mounts:
    varlog: true
    dockercontainers: false
    extra:
      - name: run-journal
        mountPath: /run/log/journal
        readOnly: true
      - name: geoip
        mountPath: /etc/geoip
        readOnly: true

  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "json"   // promtail: -log.format=json
      }

      // ---------- Kubernetes pod logs ----------

      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // --- promtail chart defaults (derive app/instance/component) ---
        rule {
          source_labels = ["__meta_kubernetes_pod_controller_name"]
          regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
          target_label  = "__tmp_controller_name"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            "__meta_kubernetes_pod_label_app",
            "__tmp_controller_name",
            "__meta_kubernetes_pod_name",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "app"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
            "__meta_kubernetes_pod_label_instance",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "instance"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_component",
            "__meta_kubernetes_pod_label_component",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "component"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["namespace", "app"]
          separator     = "/"
          replacement   = "$1"
          target_label  = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_uid",
            "__meta_kubernetes_pod_container_name",
          ]
          separator    = "/"
          replacement  = "/var/log/pods/*$1/*.log"
          target_label = "__path__"
        }
        // static pods (config hash annotation)
        rule {
          source_labels = [
            "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
            "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
            "__meta_kubernetes_pod_container_name",
          ]
          separator    = "/"
          regex        = "true/(.*)"
          replacement  = "/var/log/pods/*$1/*.log"
          target_label = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      // ---------- systemd journal ----------

      loki.relabel "journal" {
        forward_to = []

        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal__hostname"]
          target_label  = "node_name"
        }
        rule {
          source_labels = ["__journal_syslog_identifier"]
          target_label  = "syslog_identifier"
        }
      }

      loki.source.journal "journal" {
        path          = "/var/log/journal"
        max_age       = "12h"
        format_as_json = false
        labels        = { job = "systemd-journal" }
        relabel_rules = loki.relabel.journal.rules
        forward_to    = [loki.write.default.receiver]
      }

      // ---------- output ----------

      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

configReloader:
  enabled: true
  resources:
    requests:
      cpu: "10m"
      memory: "50Mi"
  # -- Security context to apply to the Grafana configReloader container.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

controller:
  # -- Type of controller to use for deploying Grafana Alloy in the cluster.
  # Must be one of 'daemonset', 'deployment', or 'statefulset'.
  type: "daemonset"

  # -- Number of pods to deploy. Ignored when controller.type is 'daemonset'.
  replicas: 1

  # -- Whether to enable automatic deletion of stale PVCs due to a scale down operation, when controller.type is 'statefulset'.
  enableStatefulSetAutoDeletePVC: false

  volumes:
    extra:
      - name: run-journal
        hostPath:
          path: /run/log/journal
      - name: geoip
        emptyDir: {}
  initContainers:
    - name: geoipupdate
      image: ghcr.io/maxmind/geoipupdate:v7
      env:
        - name: GEOIPUPDATE_EDITION_IDS
          value: GeoLite2-City
        - name: GEOIPUPDATE_DB_DIR
          value: /geoip
        - name: GEOIPUPDATE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: alloy-maxmind
              key: GEOIPUPDATE_ACCOUNT_ID
        - name: GEOIPUPDATE_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: alloy-maxmind
              key: GEOIPUPDATE_LICENSE_KEY
      volumeMounts:
        - name: geoip
          mountPath: /geoip

networkPolicy:
  enabled: false
  flavor: kubernetes

  policyTypes:
    - Ingress
    - Egress

  # Default allow all traffic because Alloy is so configurable
  # It is recommended to change this before deploying to production
  # To disable each policyType, set value to `null`
  ingress:
    - {}
  egress:
    - {}

service:
  # -- Creates a Service for the controller's pods.
  enabled: true

serviceMonitor:
  enabled: true
  # -- Additional labels for the service monitor.
  additionalLabels: {}
  # -- Scrape interval. If not set, the Prometheus default scrape interval is used.
  interval: ""
  metricRelabelings: []
  tlsConfig: {}
  relabelings: []
