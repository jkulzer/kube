apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element
  namespace: element
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-justmeowing-net-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-justmeowing-net-wildcard
  hostnames:
    - element.justmeowing.net
  rules:
    - backendRefs:
        - name: element
          port: 8080
