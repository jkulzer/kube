---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: synapse-pg
  namespace: synapse
spec:
  instances: 1
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-prod/synapse/synapse-pg
      endpointURL: https://s3.eu-central-1.idrivee2.com
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-credentials
          key: access-key-id
        secretAccessKey:
          name: cnpg-backup-credentials
          key: access-key-secret
    retentionPolicy: "7d"
  bootstrap:
    initdb:
      database: synapse
      owner: synapse
  storage:
    size: 10Gi
  monitoring:
    enablePodMonitor: true
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    # preferrably schedule on nodes with an osd so storage is more local
    additionalPodAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            namespaces: ["rook-ceph"]
            labelSelector:
              matchLabels:
                app: rook-ceph-osd

