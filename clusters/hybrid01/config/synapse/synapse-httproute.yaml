apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-internal
  namespace: synapse
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
  hostnames:
    - "justmeowing.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/login
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/logout
        - path:
            type: PathPrefix
            value: /_matrix/client/v3/refresh
      backendRefs:
        - name: mas
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse
      backendRefs:
        - name: synapse
          port: 8008
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-federation-internal
  namespace: synapse
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
  hostnames:
    - "matrix.justmeowing.net"
  rules:
    - backendRefs:
        - name: synapse
          port: 8008
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mas-internal
  namespace: synapse
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
  hostnames:
    - "matrixauth.justmeowing.net"
  rules:
    - backendRefs:
        - name: mas
          port: 8080
