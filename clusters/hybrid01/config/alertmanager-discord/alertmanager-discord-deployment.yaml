---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-discord
  namespace: alertmanager-discord
spec:
  replicas: 1
  priorityClassName: monitoring
  automountServiceAccountToken: false
  securityContext: 
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  selector:
    matchLabels:
      app: alertmanager-discord
  template:
    metadata:
      labels:
        app: alertmanager-discord
    spec:
      serviceAccountName: alertmanager-discord
      containers:
        - name: alertmanager-discord
          image: ghcr.io/matthew-beckett/alertmanager-discord:master@sha256:26228db1833d7ff2f9153a5cee0b37d5441e4d1b602029581c9c656744597f0c
          securityContext: 
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 15m
              memory: 15M
            limits:
              memory: 20M
          env:
          - name: DISCORD_WEBHOOK
            valueFrom:
              secretKeyRef: 
                name: discord-webhook
                key: webhook-url
          ports:
            - name: http
              containerPort: 9094
              protocol: TCP
