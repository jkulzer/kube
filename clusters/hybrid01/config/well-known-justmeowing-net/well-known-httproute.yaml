---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-well-known
  namespace: well-known-justmeowing-net
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
  hostnames: 
  - "justmeowing.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix
        - path:
            type: PathPrefix
            value: /.well-known/webfinger
        - path:
            type: PathPrefix
            value: /.well-known/host-meta
      backendRefs:
        - name: well-known
          port: 80
