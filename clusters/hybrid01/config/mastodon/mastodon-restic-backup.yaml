---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-restic
  namespace: mastodon
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: mastodon
    kind: SecretStore
  target:
    name: mastodon-restic
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: mastodon
        property: restic-password
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: mastodon
        property: restic-repository
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: mastodon
        property: restic-access-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: mastodon
        property: restic-access-secret
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: mastodon-media-restic
  namespace: mastodon
spec:
  # The PVC to be backed up
  sourcePVC: mastodon-media
  trigger:
    schedule: "30 * * * *"
  restic:
    moverSecurityContext:
      fsGroup: 991
    # Prune the repository (repack to free space) every 2 weeks
    pruneIntervalDays: 7
    # Name of the Secret with the connection information
    repository: mastodon-restic
    # Retention policy for backups
    retain:
      hourly: 6
      daily: 5
      weekly: 0
      monthly: 0
      yearly: 0
    copyMethod: Snapshot
    cacheCapacity: 2Gi
