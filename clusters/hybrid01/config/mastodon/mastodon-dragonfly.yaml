---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-mastodon
  namespace: mastodon
spec:
  replicas: 1
  args:
    - --maxmemory=1000M
    - --proactor_threads=2
    - --default_lua_flags=allow-undeclared-keys
  annotations:
    vault.security.banzaicloud.io/vault-addr: "http://openbao.openbao.svc.cluster.local:8200"
    vault.security.banzaicloud.io/vault-skip-verify: "false"
    vault.security.banzaicloud.io/vault-role: "mastodon"
  serviceAccountName: mastodon-openbao
  authentication:
    passwordFromSecret:
      name: mastodon-dragonfly-secret
      key: password
  resources:
    requests:
      cpu: 25m
      memory: 50M
    limits:
      memory: 500M
  snapshot:
    cron: "*/10 * * * *"
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mastodon-dragonfly-secret
  namespace: mastodon
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: mastodon
    kind: SecretStore
  target:
    name: mastodon-dragonfly-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: mastodon
        property: dragonfly-password
