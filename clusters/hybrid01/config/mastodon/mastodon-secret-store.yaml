---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mastodon
  namespace: mastodon
  annotations:
    external-secrets.io/ignore-maintenance-checks: "false"
spec:
  retrySettings:
    maxRetries: 50
    retryInterval: "10s"
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "kvv2"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "mastodon"
          serviceAccountRef:
            name: "mastodon-openbao"
