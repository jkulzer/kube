apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mastodon
  namespace: mastodon
  annotations:
    ## Add this annotation to disable controller warning events for unmaintained stores
    external-secrets.io/ignore-maintenance-checks: "false"
spec:
  retrySettings:
    maxRetries: 5
    retryInterval: "10s"

  # provider field contains the configuration to access the provider
  # which contains the secret exactly one provider must be configured.
  provider:
    # (2) Hashicorp Vault
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      # Path is the mount path of the Vault KV backend endpoint
      # Used as a path prefix for the external secret key
      path: "kvv2"
      # Version is the Vault KV secret engine version.
      # This can be either "v1" or "v2", defaults to "v2"
      version: "v2"
      auth:
        # Kubernetes auth: https://www.vaultproject.io/docs/auth/kubernetes
        kubernetes:
          mountPath: "kubernetes"
          role: "mastodon"
          serviceAccountRef:
            name: "mastodon-openbao"
