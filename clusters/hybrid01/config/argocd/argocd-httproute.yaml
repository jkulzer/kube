apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - argo.jkulzer.dev
  rules:
    - backendRefs:
        - name: argo-cd-argocd-server
          port: 80
