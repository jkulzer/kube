---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-secrets.io/ignore-maintenance-checks: "false"
spec:
  retrySettings:
    maxRetries: 50
    retryInterval: "10s"
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "kvv2"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "argocd"
          serviceAccountRef:
            name: "default"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: argocd
    kind: SecretStore
  target:
    name: argocd-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: argocd
        property: client-secret
