---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-internal
  namespace: prometheus
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - prometheus.jkulzer.dev
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-auth-prometheus-internal
  namespace: prometheus
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus-internal
  extAuth:
    http:
      backendRefs:
        - name: authelia
          namespace: authelia
          port: 80
      path: /api/authz/ext-authz/
      headersToBackend:
        - authorization
        - proxy-authorization
        - remote-user
        - remote-groups
        - remote-name
        - remote-email
    headersToExtAuth:
      - accept
      - cookie
      - proxy-authorization
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-internal
  namespace: prometheus
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - alertmanager.jkulzer.dev
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-auth-alertmanager-internal
  namespace: prometheus
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager-internal
  extAuth:
    http:
      backendRefs:
        - name: authelia
          namespace: authelia
          port: 80
      path: /api/authz/ext-authz/
      headersToBackend:
        - authorization
        - proxy-authorization
        - remote-user
        - remote-groups
        - remote-name
        - remote-email
    headersToExtAuth:
      - accept
      - cookie
      - proxy-authorization
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
