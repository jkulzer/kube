---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome
  namespace: navidrome
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - music.jkulzer.dev
  rules:
    - backendRefs:
        - name: navidrome
          port: 4533
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome-api
  namespace: navidrome
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - music.jkulzer.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rest
      backendRefs:
        - name: navidrome
          port: 4533
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-auth
  namespace: navidrome
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: navidrome
  extAuth:
    http:
      backendRefs:
        - name: authelia
          namespace: authelia
          port: 80
      path: /api/authz/ext-authz/
      headersToBackend:
        - authorization
        - proxy-authorization
        - remote-user
        - remote-groups
        - remote-name
        - remote-email
    headersToExtAuth:
      - accept
      - cookie
      - proxy-authorization
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: musiclibrary
  namespace: navidrome
spec:
  parentRefs:
    - name: envoygateway-internal
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
    - name: envoygateway-external
      namespace: envoy-gateway-system
      sectionName: https-jkulzer-dev-wildcard
  hostnames:
    - musiclibrary.jkulzer.dev
  rules:
    - backendRefs:
        - name: filebrowser
          port: 3923
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-auth-musiclibrary
  namespace: navidrome
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: musiclibrary
  extAuth:
    http:
      backendRefs:
        - name: authelia
          namespace: authelia
          port: 80
      path: /api/authz/ext-authz/
      headersToBackend:
        - authorization
        - proxy-authorization
        - remote-user
        - remote-groups
        - remote-name
        - remote-email
    headersToExtAuth:
      - accept
      - cookie
      - proxy-authorization
      - x-forwarded-proto
      - x-forwarded-host
      - x-forwarded-for
