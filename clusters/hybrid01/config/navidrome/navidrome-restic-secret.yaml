---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-restic
  namespace: navidrome
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: navidrome
    kind: SecretStore
  target:
    name: navidrome-restic
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: navidrome
        property: restic-password
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: navidrome
        property: restic-repository
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: navidrome
        property: restic-access-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: navidrome
        property: restic-access-secret
